<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a0b2e">
    <title>Glide Brands — Live Leaderboard</title>
    <!-- 100% OFFLINE: zero CDN / internet dependencies -->
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <canvas id="fx-canvas" class="fx-canvas" aria-hidden="true"></canvas>

    <div class="app">
        <!-- ============ TOP HEADER ============ -->
        <header class="topbar">
            <div class="brand">
                <div class="brand-logo"><img src="assets/logo.png" alt="glide BRANDS"></div>
                <div class="brand-titles">
                    <h1 id="board-title" class="board-title">LIVE LEADERBOARD</h1>
                    <p id="board-subtitle" class="board-subtitle">Diwali &amp; Sangeet Championship</p>
                </div>
            </div>

            <div class="topbar-actions">
                <button id="podium-btn" class="pill-btn pill-gold" title="Celebrate Winner / Podium (P)">
                    <span>🏆</span> <span class="btn-label">Winner Reveal</span>
                </button>
                <button id="sound-toggle" class="icon-btn" title="Sound effects on/off" aria-pressed="true">🔊</button>
                <button id="fullscreen-toggle" class="icon-btn" title="Full Screen (F)">⛶</button>
            </div>
        </header>

        <!-- ============ MAIN GIANT LEADERBOARD (85%+ OF SCREEN) ============ -->
        <main class="main">
            <div id="leaderboard" class="leaderboard" role="list"></div>
        </main>

        <!-- ============ ULTRA-LOW BOTTOM SCORING DOCK ============ -->
        <footer class="bottom-dock">
            <div id="dock-teams" class="dock-teams" aria-label="Quick score controls"></div>

            <div class="dock-System">
                <button id="undo-btn" class="dock-btn" title="Undo last point change" disabled>↩ Undo</button>
                <button id="add-team-btn" class="dock-btn" title="Add another team (PIN: 1234)">+ Team</button>
                <button id="edit-btn" class="dock-btn" title="Edit points or team names (PIN: 1234)">✏️ Edit</button>
                <button id="reset-btn" class="dock-btn dock-btn-danger" title="Reset all scores to 0 (PIN: 1234)">🔄 Reset</button>
            </div>
        </footer>
    </div>

    <!-- ============ PIN 1234 MODAL ============ -->
    <div id="pin-modal" class="modal" hidden>
        <div class="modal-box card" role="dialog" aria-modal="true" aria-labelledby="pin-title">
            <div class="modal-icon">🔐</div>
            <h3 id="pin-title" class="modal-title">Enter Password</h3>
            <p id="pin-desc" class="modal-desc">Enter password to continue.</p>
            <form id="pin-form" autocomplete="off">
                <input id="pin-input" type="password" inputmode="numeric" maxlength="8" class="pin-input mono" placeholder="••••" required>
                <p id="pin-error" class="pin-error" hidden>Wrong password! Try again.</p>
                <div class="modal-actions">
                    <button type="button" id="pin-cancel" class="btn btn-secondary">Cancel</button>
                    <button type="submit" class="btn btn-primary">Unlock</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ============ ADD TEAM MODAL ============ -->
    <div id="add-modal" class="modal" hidden>
        <div class="modal-box card" role="dialog" aria-modal="true" aria-labelledby="add-modal-title">
            <h3 id="add-modal-title" class="modal-title">Add New Team</h3>
            <form id="add-team-form" class="edit-form" autocomplete="off">
                <label class="field">
                    <span>Team Name</span>
                    <input id="new-team-name" type="text" class="input" placeholder="e.g. Royal Strikers" maxlength="36" required>
                </label>
                <label class="field">
                    <span>Starting Points</span>
                    <input id="new-team-points" type="number" class="input mono" value="0" step="5" required>
                </label>
                <div class="modal-actions">
                    <button type="button" id="add-cancel" class="btn btn-secondary">Cancel</button>
                    <button type="submit" class="btn btn-primary">+ Add Team</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ============ EDIT TEAMS & SCORES MODAL (PIN 1234 PROTECTED) ============ -->
    <div id="edit-modal" class="modal" hidden>
        <div class="modal-box modal-wide card" role="dialog" aria-modal="true" aria-labelledby="edit-modal-title">
            <h3 id="edit-modal-title" class="modal-title">Edit Teams &amp; Exact Points</h3>
            <p class="modal-desc">Change team names, set exact scores, or remove a team.</p>
            <div id="edit-teams-list" class="edit-teams-list"></div>
            <div class="modal-actions">
                <button type="button" id="edit-cancel" class="btn btn-secondary">Cancel</button>
                <button type="button" id="edit-save" class="btn btn-primary">Save All Changes</button>
            </div>
        </div>
    </div>

    <!-- ============ WINNER / PODIUM REVEAL MODAL ============ -->
    <div id="podium-modal" class="modal podium-overlay" hidden>
        <div class="podium-box card" role="dialog" aria-modal="true" aria-label="Champions Podium">
            <button id="podium-close" class="podium-close" title="Close (Esc)">✕</button>
            <div class="podium-header">
                <div class="brand-logo podium-logo"><img src="assets/logo.png" alt="glide BRANDS"></div>
                <h2 class="podium-title">CHAMPIONS LEADERBOARD</h2>
            </div>
            <div id="podium-stage" class="podium-stage"></div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
